{% extends "base.html" %}

{% block title %}
Reset Password | SecureVault
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6 col-md-8">

        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-header bg-success text-white">

                <h3 class="mb-0">

                    <i class="fas fa-lock me-2"></i>

                    Set New Password

                </h3>

            </div>

            <div class="card-body p-4">

                <form method="POST">

                    {{ form.hidden_tag() }}

                    <div class="mb-3">

                        <label class="form-label">
                            New Password
                        </label>

                        <input
                            type="password"
                            name="new_password"
                            class="form-control"
                            minlength="6"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            minlength="6"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="fas fa-save me-2"></i>

                        Reset Password

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
