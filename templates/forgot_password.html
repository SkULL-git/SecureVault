{% extends "base.html" %}

{% block title %}
Password Recovery | SecureVault
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6 col-md-8">

        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <i class="fas fa-unlock-alt fa-3x text-warning mb-3"></i>

                    <h2 class="fw-bold">
                        Recover Password
                    </h2>

                    <p class="text-muted">
                        Enter your email and the recovery key saved during registration.
                    </p>

                </div>

                <form method="POST">

                    {{ form.hidden_tag() }}

                    <div class="mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Recovery Key
                        </label>

                        <input
                            type="text"
                            name="recovery_key"
                            class="form-control font-monospace"
                            placeholder="SV-..."
                            autocomplete="off"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-warning w-100">

                        <i class="fas fa-shield-alt me-2"></i>

                        Verify Recovery Key

                    </button>

                </form>

                <div class="text-center mt-3">

                    <a href="{{ url_for('auth.login') }}">
                        Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
